name: Daily File Sync

on:
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00 UTC every day
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Enable caching for pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run sync script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # Pass the token if available
        run: python sync_script.py
        timeout-minutes: 10 # Prevent infinite loops

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check for changes
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected. Committing..."
            git add .
            git commit -m "Auto-sync: Update files from remote sources"
            git push
          else
            echo "No changes detected."
          fi
